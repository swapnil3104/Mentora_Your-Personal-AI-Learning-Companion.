# ========================================================
# Mentora v1.0 - Production Docker Compose Orchestration
# ========================================================
# Services:
#   1. postgres     - PostgreSQL 16 relational database with persistent storage
#   2. ai-service   - FastAPI AI engine (RAG, Chunking, ChromaDB, Visuals)
#   3. backend      - Express.js API gateway, authentication, document service
#   4. frontend     - React SPA served via Nginx reverse proxy (Port 80)
# ========================================================

version: '3.8'

networks:
  mentora-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  chroma_data:
    driver: local
  uploads_data:
    driver: local
  ai_logs:
    driver: local

services:
  # ------------------------------------------------------
  # 1. PostgreSQL Database
  # ------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mentora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mentora_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mentora_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-mentora_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - mentora-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mentora_admin} -d ${POSTGRES_DB:-mentora_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------
  # 2. Python + FastAPI AI Engine
  # ------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: mentora-ai-service
    restart: unless-stopped
    environment:
      PORT: 8000
      HOST: "0.0.0.0"
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      CHROMA_PERSIST_DIRECTORY: /app/chroma_data
      CHROMA_COLLECTION_NAME: ${CHROMA_COLLECTION:-mentora_study_materials}
      CHUNK_SIZE_TOKENS: 600
      CHUNK_OVERLAP_TOKENS: 90
      RAG_TOP_K: 5
      RAG_MIN_RELEVANCE: 0.35
      RAG_MAX_CONTEXT_TOKENS: 3000
      LLM_TEMPERATURE: 0.2
      LLM_NUM_CTX: 4096
      LLM_NUM_PREDICT: 1500
      LLM_TIMEOUT_SECONDS: 180
      CORS_ORIGINS: "*"
    volumes:
      - chroma_data:/app/chroma_data
      - ai_logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    networks:
      - mentora-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ------------------------------------------------------
  # 3. Node.js + Express API Backend
  # ------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mentora-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-mentora_admin}:${POSTGRES_PASSWORD:-mentora_secure_password_2026}@postgres:5432/${POSTGRES_DB:-mentora_prod}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-mentora_super_secret_jwt_key_2026_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: "*"
      AI_SERVICE_URL: http://ai-service:8000
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: 25
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"
    networks:
      - mentora-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ------------------------------------------------------
  # 4. React Frontend & Nginx Gateway
  # ------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mentora-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - mentora-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
